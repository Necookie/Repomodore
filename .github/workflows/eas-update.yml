name: Publish EAS Over-The-Air Update

on:
  workflow_dispatch:
    inputs:
      channel:
        description: 'EAS Update Channel (e.g. preview, production)'
        required: true
        default: 'preview'

jobs:
  publish-update:
    name: Publish EAS OTA Update
    runs-on: ubuntu-latest
    if: false # Activated when EXPO_TOKEN repository secret is configured

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Setup EAS CLI
        uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Publish Update
        run: eas update --auto --channel ${{ github.event.inputs.channel || 'preview' }}
