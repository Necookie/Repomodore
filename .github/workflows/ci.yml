name: CI Architecture & Quality Gate

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  validate:
    name: Typecheck, Lint, Test & Web Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run TypeScript typecheck
        run: npm run typecheck

      - name: Run ESLint
        run: npm run lint

      - name: Run Jest test suite
        run: npm test -- --coverage

      - name: Build Web Architecture Bundle
        run: npm run build:web
        env:
          EXPO_PUBLIC_CLERK_PUBLISHABLE_KEY: pk_test_Y2xlcmsuZXhhbXBsZS5jb20k
          EXPO_PUBLIC_SYNC_API_URL: http://localhost:3001

      - name: Upload Web Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: repomodore-web-dist
          path: dist/
          retention-days: 7
